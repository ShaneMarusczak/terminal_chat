[package]
name = "tc"
version = "0.1.0"
edition = "2024"

[profile.release]
panic = "abort"
lto = true
opt-level = 'z'
codegen-units = 1
strip = true
debug = false
incremental = false

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
crossterm = { version = "0.29.0" }
linefeed = { version = "0.6.0", default-features = false }
reqwest = { version = "0.12.25", features = ["rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"], default-features = false }
serde_json = { version = "1.0.145", features = ["std"], default-features = false }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"], default-features = false }
dirs = { version = "6.0.0", default-features = false }
