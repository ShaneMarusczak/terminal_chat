name: Rust CI

on:
  push:
    branches:
      - 'feature/**'
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: clippy

    - name: Check formatting
      run: cargo fmt --check
      if: matrix.os == 'ubuntu-latest'

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      if: matrix.os == 'ubuntu-latest'

    - name: Run tests
      run: cargo test --verbose

    - name: Build release
      run: cargo build --release
